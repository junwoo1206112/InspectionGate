goal: >-
  C:\\AI\\InspectionGate에 모델 제안을 사람이 검토하고 최종 결정하는 로컬 제조
  이미지 결함 판정 보조 애플리케이션을 구축하여, 감사 가능한 제품 설계 역량을
  최우선으로 입증하고 평가 및 실행 재현성을 보조 증거로 제시한다.
task_type: code
constraints:
  - 구현 전에 컴퓨터 비전·데이터 평가, ML 서빙·재현성, human-in-the-loop 안전·제품 UX의 세 전문가 관점에서 각각 독립적으로 웹과 GitHub 근거를 조사하고 교차 검증한 한국어 단계별 실행 권고안을 작성한다.
  - 권고안은 사람과 LLM이 실행할 수 있어야 하며, 작업 위치는 C:\\AI\\InspectionGate이다.
  - 로컬 단일 검토자가 저장된 이미지를 검토하는 범위로 한정한다.
  - 모델 출력은 최종 판정이 아닌 제안이며 기준 미달 또는 입력 품질 문제가 있으면 HOLD로 전환한다.
  - 검토자는 승인·반려·라벨 수정과 사유 기록 및 감사 이력 조회를 수행할 수 있어야 한다.
  - 낮은 모델 점수 HOLD는 사유가 있는 최종 결정을 남길 수 있고, 입력 품질 HOLD는 해제할 수 없으며 새 이미지의 재검사에는 새 prediction_id가 필요하다.
  - 감사 이력에는 모델·입력·임계값·결정·검토 사유가 포함되어야 한다.
  - 누수 없는 평가, 교란 오류 분석, ONNX/FastAPI/Docker 실행과 재현 절차 검증을 포함한다.
  - 모델 성능에는 임의 합격선을 두지 않고 실제 측정값과 한계를 보고한다.
  - 다중 검토자, 인증·권한 분리, 실시간 이미지 수집, 설비·ERP·MES 연동, 공장 배포, 실제 생산 사용자, 클라우드 MLOps, C++·하드웨어 경험은 구현하거나 주장하지 않는다.
acceptance_criteria:
  - description: 세 전문가 관점의 독립 웹·GitHub 근거와 교차 검증 결과, 단계별 실행 권고, 주장 경계를 담은 한국어 문서가 있다.
    verify_command: python -m pytest -q tests/test_research_docs.py
  - description: 단일 검토자는 저장 이미지의 모델 제안을 승인·반려·수정하고 사유를 남기며, 감사 이력을 조회할 수 있다. 저점수 HOLD는 사유가 있는 최종 결정이 가능하고 품질 HOLD는 해제되지 않으며 재업로드는 새 prediction_id로 처리된다.
    verify_command: python -m pytest -q tests/test_review_workflow.py
  - description: 누수 방지 근거, clean 평가, 교란 오류 분석, 실제 수치와 한계를 기록한다.
    verify_command: python -m pytest -q tests/test_evaluation_evidence.py
  - description: ONNX 내보내기·추론 일치, FastAPI 정상/오류 입력, Docker 기반 로컬 실행 경로를 검증한다.
    verify_command: python -m pytest -q tests/test_serving_reproducibility.py
exit_conditions:
  - name: 완료
    description: 문서와 구현의 모든 수용 기준을 실제 검증으로 충족하고, 포트폴리오 주장 범위를 정직하게 명시한다.
    criteria: >-
      세 전문가 관점의 독립 조사·교차 검증 문서가 있고, 로컬 단일 검토자의 정상 검토,
      저점수 HOLD 최종 결정, 품질 HOLD 해제 차단과 새 prediction_id 재검사, 감사 이력 조회,
      누수 방지 평가·교란 오류 분석·ONNX/FastAPI/Docker 재현 절차가 실제 검증된다.
ontology_schema:
  name: LocalInspectionReview
  type: object
  description: 저장 제조 이미지의 모델 제안, HOLD, 사람의 최종 결정과 감사 증거를 표현한다.
  fields:
    - name: prediction_id
      type: string
      description: 개별 추론 식별자이며 품질 HOLD 재업로드에는 새 값이 부여된다.
      required: true
    - name: proposal
      type: object
      description: 최종 판정과 분리된 모델 제안 라벨과 점수다.
      required: true
    - name: hold
      type: object
      description: HOLD 여부와 low_score 또는 input_quality 사유다.
      required: true
    - name: review_decision
      type: object
      description: 승인·반려·수정과 사유를 기록하는 사람의 최종 결정이다.
      required: true
    - name: audit_history
      type: array
      description: 모델·입력·임계값·결정·검토 사유의 감사 이력이다.
      required: true
